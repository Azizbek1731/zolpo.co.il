# /etc/nginx/sites-available/zolpo
# Reverse proxy for the Zolpo homepage automation demo.
# __DOMAIN__ / __APP_PORT__ are substituted by deploy/setup.sh; certbot --nginx
# adds the TLS block in place. This file only ever adds a server block — the other
# sites on the host are left alone.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Next.js fingerprints these, so they are safe to cache hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    client_max_body_size 10m;
}
